<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Image prep</title>
  <link rel="icon" href="data:,"/>
  <link rel="stylesheet" href="./src/style.css"/>
</head>
<body>
  <svg class="svg-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
<symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V3m-5 5 5-5 5 5M4 15v5h16v-5"/></symbol>
<symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v13m-5-5 5 5 5-5M4 16v5h16v-5"/></symbol>
<symbol id="i-undo" viewBox="0 0 24 24"><path d="m8 4-5 5 5 5M3 9h11a6 6 0 0 1 0 12"/></symbol>
<symbol id="i-redo" viewBox="0 0 24 24"><path d="m16 4 5 5-5 5m5-5H10a6 6 0 0 0 0 12"/></symbol>
<symbol id="i-flip" viewBox="0 0 24 24"><path d="M12 2v20M3 18V6l6 12H3Zm18 0V6l-6 12h6Z"/></symbol>
<symbol id="i-rotate" viewBox="0 0 24 24"><path d="M20 8a9 9 0 1 0 1 8M20 2v6h-6"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
<symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
<symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></symbol>
</defs></svg>
  <input id="image-input" type="file" accept="image/png,image/jpeg,image/webp,image/avif,image/bmp" hidden/>
  <section id="empty-state" class="empty-state">
    <button class="button primary upload-trigger"><svg><use href="#i-upload"/></svg>Open image</button>
    <span>or drop an image</span>
  </section>
  <header id="app-header" class="app-header" hidden>
    <div class="file-info"><span id="source-name"></span><small id="source-dimensions"></small></div>
    <nav class="main-tabs" aria-label="View"><button class="main-tab active" data-view="lab">Image</button><button class="main-tab" data-view="sheet">Contact sheet</button></nav>
    <div class="header-actions"><button class="text-button upload-trigger" title="Replace image"><svg><use href="#i-upload"/></svg><span>Replace</span></button><button id="close-image" class="icon-button" title="Close image" aria-label="Close image"><svg><use href="#i-close"/></svg></button><button class="button primary export-open"><svg><use href="#i-download"/></svg>Export</button></div>
  </header>
  <main id="app-layout" class="app-layout" hidden>
    <aside class="controls" id="controls">
      <section class="control-section print-size">
        <div class="section-heading"><h2>Print size</h2><select id="dimension-unit" aria-label="Dimension units"><option value="mm">mm</option><option value="in">in</option></select></div>
        <div class="two-fields"><label>Width<input id="print-width" type="number" min="10" max="2000" step="0.1" value="150"/></label><span class="size-link" title="Aspect ratio locked">×</span><label>Height<input id="print-height" type="number" min="1" step="0.1" value="225"/></label></div>
      </section>
      <div id="lab-controls">
        <div class="tool-tabs" aria-label="Image tools"><button class="active" data-tool="adjust">Adjust</button><button data-tool="retouch">Retouch</button></div>
        <div id="adjust-controls">
          <section class="control-section"><div class="section-heading"><h2>Tones</h2><button class="small-text" id="reset-all">Reset</button></div><div id="sliders"></div></section>
          <section class="control-section"><div class="section-heading"><h2>Curves</h2><select id="curve-preset" aria-label="Curve preset"><option value="linear">Linear</option><option value="contrast">S-curve</option><option value="soft">Soft</option><option value="custom" hidden>Custom</option></select></div><div class="curve-wrap"><canvas id="curve-canvas" width="512" height="288" aria-label="Histogram"></canvas><svg id="curve-editor" viewBox="0 0 256 144" aria-label="Tone curve" role="group"><path id="curve-line"/><g id="curve-handles"></g></svg></div></section>
          <label class="toggle-row"><span>Invert</span><input type="checkbox" id="invert" checked/><span class="switch"></span></label>
        </div>
        <div id="retouch-controls" hidden>
          <label class="range-label" for="brush-size">Brush <output id="brush-size-value">40 px</output></label><input id="brush-size" type="range" min="5" max="180" value="40"/>
          <label class="range-label" for="brush-opacity">Opacity <output id="brush-opacity-value">100%</output></label><input id="brush-opacity" type="range" min="10" max="100" value="100"/>
          <button id="pick-source" class="button secondary full-width">Sample source</button><p id="clone-status" class="field-note">Alt-click to sample.</p><button id="clear-retouch" class="small-text">Clear retouching</button>
        </div>
      </div>
      <div id="sheet-controls" hidden>
        <section class="control-section"><div class="section-heading"><h2>Layout</h2></div><div class="layout-options"><button class="layout-option active" data-layout="strip">4-up strip</button><button class="layout-option" data-layout="grid6">3 × 2</button><button class="layout-option" data-layout="grid9">3 × 3</button></div></section>
        <section class="control-section"><div class="section-heading"><h2>Sample size</h2><span id="sample-unit">mm</span></div><div class="two-fields"><label>Width<input id="sample-width" type="number" min="1" step="0.1" value="50"/></label><span class="size-link">×</span><label>Height<input id="sample-height" type="number" min="1" step="0.1" value="50"/></label></div><div id="crop-picker" class="crop-picker" title="Choose the sample area" aria-label="Sample position" role="slider" tabindex="0" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50"><div class="crop-image" id="crop-image"><canvas id="crop-canvas"></canvas><div id="crop-box"></div></div></div><div id="sample-scale" class="field-note">100% print scale</div></section>
        <section class="control-section"><div class="section-heading"><h2>Variations</h2></div><label class="select-label" for="variation-axis">Columns</label><select id="variation-axis" class="full-select"><option value="contrast">Contrast</option><option value="exposure">Exposure</option><option value="grain">Grain</option><option value="shadows">Shadows</option><option value="highlights">Highlights</option></select><label class="range-label" for="variation-step">Step <output id="variation-step-value">15</output></label><input id="variation-step" type="range" min="1" max="40" value="15"/><div id="second-axis"><label class="select-label" for="variation-axis2">Rows</label><select id="variation-axis2" class="full-select"><option value="none">Continue sequence</option><option value="grain" selected>Grain</option><option value="contrast">Contrast</option><option value="exposure">Exposure</option><option value="shadows">Shadows</option><option value="highlights">Highlights</option></select><label class="range-label" for="variation-step2">Step <output id="variation-step2-value">20</output></label><input id="variation-step2" type="range" min="1" max="40" value="20"/></div></section>
        <div class="section-heading"><label class="select-label" for="sheet-divider">Divider</label><select id="sheet-divider"><option value="0">None</option><option value="0.1" selected>0.1 mm</option><option value="0.2">0.2 mm</option></select></div>
      </div>
    </aside>
    <section class="workspace" aria-label="Preview">
      <div class="workspace-toolbar"><div class="preview-modes" role="group" aria-label="Preview mode"><button data-mode="original">Original</button><button class="active" data-mode="negative">Negative</button><button data-mode="proof" title="Uncalibrated cyanotype simulation">Blue preview</button></div><div class="transform-buttons"><button id="mirror" class="icon-button" aria-pressed="false" title="Mirror horizontally" aria-label="Mirror horizontally"><svg><use href="#i-flip"/></svg></button><button id="flip" class="icon-button" aria-pressed="false" title="Flip vertically" aria-label="Flip vertically"><svg class="vertical-icon"><use href="#i-flip"/></svg></button><button id="rotate" class="icon-button" title="Rotate 90°" aria-label="Rotate 90 degrees"><svg><use href="#i-rotate"/></svg></button><span class="toolbar-divider"></span><button class="icon-button" id="undo" title="Undo (⌘ / Ctrl Z)" aria-label="Undo" disabled><svg><use href="#i-undo"/></svg></button><button class="icon-button" id="redo" title="Redo (⌘ / Ctrl ⇧ Z)" aria-label="Redo" disabled><svg><use href="#i-redo"/></svg></button><button class="icon-button" id="compare" aria-pressed="false" title="Compare original (hold backslash)" aria-label="Compare original"><svg><use href="#i-eye"/></svg></button></div></div>
      <div class="workspace-content"><div class="canvas-viewport" id="canvas-viewport"><div class="canvas-center" id="canvas-center"><div class="image-view" id="image-mount"><div class="image-holder" id="image-holder"><canvas id="preview-canvas" aria-label="Image"></canvas><div id="brush-cursor" hidden></div><div id="clone-marker" hidden>+</div></div></div><div id="sheet-preview" class="sheet-preview" hidden></div></div></div><div id="variant-list" class="variant-list" hidden aria-label="Variation settings"></div></div>
      <div class="workspace-footer"><span id="work-meta"></span><div class="zoom-control"><button class="icon-button" id="zoom-out" title="Zoom out" aria-label="Zoom out"><svg><use href="#i-minus"/></svg></button><span id="zoom-label">Fit</span><button class="icon-button" id="zoom-in" title="Zoom in" aria-label="Zoom in"><svg><use href="#i-plus"/></svg></button><button id="zoom-fit" class="small-text">Fit</button></div></div>
    </section>
  </main>
  <div id="drop-overlay" hidden><svg><use href="#i-upload"/></svg>Open image</div>
  <dialog id="export-dialog"><form method="dialog" class="dialog-content"><button class="dialog-close icon-button" aria-label="Close"><svg><use href="#i-close"/></svg></button><h2>Export</h2><label class="select-label" for="export-kind">Content</label><select id="export-kind" class="full-select"><option value="image">Image</option><option value="sheet">Contact sheet</option></select><div class="two-fields"><label>Format<select id="export-format"><option value="png">PNG</option><option value="pdf">PDF</option></select></label><label>Resolution<select id="export-dpi"><option value="150">150 DPI</option><option value="300" selected>300 DPI</option><option value="600">600 DPI</option></select></label></div><label class="select-label" for="export-polarity">Polarity</label><select id="export-polarity" class="full-select"><option value="negative">Negative</option><option value="positive">Positive</option></select><div class="export-summary" id="export-summary"></div><p class="field-note">Print at 100% / actual size.</p><p id="export-error" class="error-text" role="alert" hidden></p><button id="download-export" class="button primary full-width" type="button"><svg><use href="#i-download"/></svg><span>Download</span></button></form></dialog>
  <dialog id="variation-dialog"><div class="dialog-content"><button class="dialog-close icon-button" aria-label="Close" data-close="variation-dialog"><svg><use href="#i-close"/></svg></button><h2 id="variation-title"></h2><canvas id="variation-canvas"></canvas><p id="variation-description"></p><button id="apply-variation" class="button primary full-width">Apply settings</button></div></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
